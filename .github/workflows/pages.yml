name: Deploy Devilflygotchi — original Java ME
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: devilflygotchi-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Devilflygotchi
        uses: actions/checkout@v4
      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Devil_240x320.jar >/dev/null
          unzip -p Devil_240x320.jar META-INF/MANIFEST.MF | grep -q '^MIDlet-1:'
      - name: Extract original PNG sprites from JAR packs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, struct, zipfile
          z=zipfile.ZipFile('Devil_240x320.jar')
          os.makedirs('sprites',exist_ok=True)
          def base(n):
              if 2<=n<=5:return n-2
              if n<=11:return {6:4,7:6,8:12,9:29,10:43,11:51}[n]
              if n<=15:return 70+(n-12)*2
              return 78+(n-16)*25
          count=0
          for n in range(2,28):
              d=z.read(f'pack{n}.bin')
              cnt=struct.unpack('>H',d[:2])[0]
              offsets=struct.unpack('>'+str(cnt+1)+'I',d[2:2+4*(cnt+1)])
              for i in range(cnt):
                  blob=d[offsets[i]:offsets[i+1]]
                  if blob.startswith(bytes([137,80,78,71])):
                      with open(f'sprites/q{base(n)+i:03d}.png','wb') as out:out.write(blob)
                      count+=1
          print('Extracted original sprites:',count)
          assert count>=300
          assert os.path.getsize('sprites/q070.png')>100
          assert os.path.getsize('sprites/q078.png')>100
          PY
      - name: Export authentic animation and script binaries\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 tools/export_original_packs.py Devil_240x320.jar original-data\n          python3 - <<'PY'\n          import json\n          a=json.load(open('original-data/pack0.json'))\n          b=json.load(open('original-data/pack1.json'))\n          assert a['count']==59, a['count']\n          assert b['count']==61, b['count']\n          print('Verified original packs:', a['count'], b['count'])\n          PY\n      - name: Download pinned FreeJ2ME-Web
        shell: bash
        env:
          FREEJ2ME_COMMIT: c19416e75cbc15f9a27f7e967ee81cb108761e30
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zb3/freej2me-web.git "${RUNNER_TEMP}/freej2me-web"
          git -C "${RUNNER_TEMP}/freej2me-web" fetch --depth 1 origin "${FREEJ2ME_COMMIT}"
          git -C "${RUNNER_TEMP}/freej2me-web" checkout --detach "${FREEJ2ME_COMMIT}"
      - name: Build static site with original JAR
        shell: bash
        run: |
          set -euo pipefail
          SITE="${RUNNER_TEMP}/site"
          mkdir -p "${SITE}/emulator/jar"
          rsync -a --exclude='.git' --exclude='.github' --exclude='site' ./ "${SITE}/"
          cp -a "${RUNNER_TEMP}/freej2me-web/web/." "${SITE}/emulator/"
          cp "${RUNNER_TEMP}/freej2me-web/LICENSE" "${SITE}/emulator/LICENSE"
          cp Devil_240x320.jar "${SITE}/emulator/jar/game.jar"
          test -s "${SITE}/emulator/run.html"
          test -s "${SITE}/emulator/freej2me-web.jar"
          test -s "${SITE}/emulator/init.zip"
          test -s "${SITE}/emulator/jar/game.jar"
          test -s "${SITE}/legacy.html"\n          test -s "${SITE}/original-data.html"\n          test -s "${SITE}/original-data/pack0.json"\n          test -s "${SITE}/original-data/pack1.json"
          grep -q 'Jogo Java ME original' "${SITE}/index.html"\n          test -s "${SITE}/reconstruction.html"
          test -s "${SITE}/sprites/q070.png"
          test -s "${SITE}/sprites/q078.png"
          unzip -t "${SITE}/emulator/jar/game.jar" >/dev/null
          echo "Pacote estático construído; a compatibilidade do jogo deve ser verificada no navegador."
      - name: Keep emulator assets in the repository for branch-based Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          # The repository may still be configured to publish Pages directly
          # from main. In that mode the generated artifact alone is not enough.
          mkdir -p emulator/jar
          cp -a "${RUNNER_TEMP}/freej2me-web/web/." emulator/
          cp "${RUNNER_TEMP}/freej2me-web/LICENSE" emulator/LICENSE
          cp Devil_240x320.jar emulator/jar/game.jar
          touch .nojekyll
          git add -f emulator sprites original-data .nojekyll
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish original J2ME emulator assets for GitHub Pages'
            git push origin HEAD:main
          fi
      - name: Save site for deployment
        uses: actions/upload-artifact@v4
        with:
          name: devilflygotchi-site
          path: ${{ runner.temp }}/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: devilflygotchi-site
          path: ./site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Check publicly served emulator paths
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vyktorbio.github.io/Devilflygotchi"
          for file in index.html sprites/q070.png sprites/q078.png emulator/run.html emulator/freej2me-web.jar emulator/jar/game.jar; do
            echo "Checking ${BASE}/${file}"
            curl --fail --location --silent --show-error --retry 12 --retry-delay 8 --retry-all-errors --output /dev/null "${BASE}/${file}"
          done
