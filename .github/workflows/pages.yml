name: Deploy Devilflygotchi
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FreeJ2ME-Web emulator
        run: |
          git clone --depth 1 https://github.com/zb3/freej2me-web.git /tmp/freej2me-web
          mkdir -p emulator
          cp -a /tmp/freej2me-web/web/. emulator/
          mkdir -p emulator/apps
          if [ -d game-packages ]; then cp game-packages/*.zip emulator/apps/ 2>/dev/null || true; fi
      - name: Check game asset
        run: test -f Devil_240x320.jar
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
