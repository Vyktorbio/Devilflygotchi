name: Install HTML5 sprites
on:
  push:
    paths:
      - .github/workflows/install-web-sprites.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest extracted sprite artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name=="devilflygotchi-web-sprites" and .expired==false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then echo "Sprite artifact not found"; exit 1; fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > /tmp/sprites.zip
          mkdir -p sprites
          unzip -oq /tmp/sprites.zip -d /tmp/extracted
          find /tmp/extracted -type f -name '*.png' -exec cp {} sprites/ \;
          python - <<'PY'
          import pathlib,json
          files=sorted(p.name for p in pathlib.Path('sprites').glob('*.png'))
          pathlib.Path('sprites/manifest.json').write_text(json.dumps([{'file':f} for f in files]))
          print('Sprites:',len(files))
          if not files: raise SystemExit('No sprites found')
          PY
      - name: Commit sprite assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sprites/
          git commit -m "Publish extracted Devilflygotchi sprites for HTML5" || exit 0
          git push
