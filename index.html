<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111018"><title>Devilflygotchi — HTML5</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#100d17;color:#eee}*{box-sizing:border-box}body{margin:0}main{max-width:540px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:21px;margin:8px 0}small,.note{color:#aaa1b7;font-size:12px}select,button{background:#2e263d;border:1px solid #625576;border-radius:10px;color:#fff;padding:11px;font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #b6a2ed}canvas{display:block;margin:15px auto;width:min(100%,360px);height:auto;aspect-ratio:3/4;image-rendering:pixelated;border:6px solid #534564;border-radius:18px;background:#c8c1d8;touch-action:manipulation}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#201a2b;border-radius:10px;padding:9px;font-size:12px}.stat meter{display:block;width:100%;margin-top:6px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.actions button{min-height:47px}#message{min-height:25px;text-align:center}label{display:block;font-size:13px;margin-top:12px}.note{line-height:1.5}a{color:#c5b2ff}</style></head><body><main><header><h1>DEVILFLYGOTCHI</h1><small>HTML5 · beta</small></header><label for="family">Criatura</label><select id="family" style="width:100%"></select><canvas id="screen" width="240" height="320" aria-label="Arena do Devilflygotchi"></canvas><div class="stats"><div class="stat">🍬 Saciedade <meter id="food" min="0" max="100"></meter></div><div class="stat">♥ Humor <meter id="mood" min="0" max="100"></meter></div><div class="stat">⚡ Energia <meter id="energy" min="0" max="100"></meter></div></div><p id="message" role="status"></p><nav class="actions"><button id="feed">🍬 Alimentar</button><button id="play">🎲 Brincar</button><button id="sleep">💤 Dormir</button><button id="wake">☀️ Acordar</button><button id="reset">↻ Reiniciar</button><button id="fullscreen">⛶ Tela cheia</button></nav><p class="note">Versão nativa experimental: sprites originais, animação, necessidades e salvamento local. As regras são provisórias e ainda não reproduzem integralmente o Java ME. Criaturas selecionadas: packs 17, 19, 21 e 26.</p><p class="note"><a href="./Devil_240x320.jar">Arquivo JAR preservado</a></p></main><script>
'use strict';
const $=q=>document.querySelector(q),canvas=$('#screen'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const excluded=new Set([2,3,4,5,12,13,14,15]),key='devilflygotchi-native-v2';
const defaults={family:'',food:75,mood:75,energy:80,asleep:false,last:Date.now()};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{state={...defaults}}
const packs=new Map(),cache=new Map();let actionUntil=0,action='idle',lastTick=performance.now();
function clamp(n){return Math.max(0,Math.min(100,n))}
function save(){state.last=Date.now();try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function message(s){$('#message').textContent=s}
function stats(){for(const id of ['food','mood','energy'])$('#'+id).value=state[id]}
function image(name){if(!cache.has(name)){const im=new Image();im.src='sprites/'+name;cache.set(name,im)}return cache.get(name)}
function tick(sec){if(state.asleep){state.energy=clamp(state.energy+sec*.028);state.food=clamp(state.food-sec*.002)}else{state.food=clamp(state.food-sec*.005);state.energy=clamp(state.energy-sec*.003);state.mood=clamp(state.mood-sec*.002)}}
function render(now){const sec=Math.min(2,(now-lastTick)/1000);lastTick=now;tick(sec);stats();
ctx.fillStyle='#c7bfd7';ctx.fillRect(0,0,240,320);ctx.fillStyle='#a69bb9';ctx.fillRect(0,254,240,66);ctx.fillStyle='#e5dfee';ctx.fillRect(8,9,224,35);ctx.fillStyle='#332743';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText('DEVILFLYGOTCHI',120,30);
const frames=packs.get(state.family)||[];if(frames.length){let frame=state.asleep?Math.floor(now/950):now<actionUntil?Math.floor(now/120):Math.floor(now/440);const f=frames[frame%frames.length];const im=image(f);if(im.complete&&im.naturalWidth){const w=Math.min(125,Math.max(60,im.naturalWidth*2.4)),h=Math.min(125,Math.max(60,im.naturalHeight*2.4));const bob=state.asleep?0:Math.sin(now/430)*4;ctx.drawImage(im,120-w/2,175-h/2+bob,w,h)}else{ctx.font='12px monospace';ctx.fillText('Carregando sprite...',120,175)}}else{ctx.font='12px monospace';ctx.fillText('Sprites indisponíveis',120,170)}
ctx.fillStyle='#332743';ctx.font='12px monospace';ctx.fillText(state.asleep?'Z z z':state.food<20?'Com fome':state.energy<20?'Cansado':state.mood<20?'Entediado':'Acordado',120,282);requestAnimationFrame(render)}
function act(type){if(state.asleep&&type!=='wake'&&type!=='sleep'){message('Está dormindo. Acorde primeiro.');return}if(type==='feed'){state.food=clamp(state.food+20);state.mood=clamp(state.mood+3);message('Alimentado!')}if(type==='play'){state.mood=clamp(state.mood+18);state.energy=clamp(state.energy-10);state.food=clamp(state.food-5);message('Hora de brincar!')}if(type==='sleep'){state.asleep=true;message('Dormindo...')}if(type==='wake'){state.asleep=false;message('Acordou!')}action=type;actionUntil=performance.now()+1600;stats();save()}
for(const type of ['feed','play','sleep','wake'])$('#'+type).onclick=()=>act(type);
$('#family').onchange=e=>{state.family=e.target.value;save();message('Criatura selecionada.')};
$('#reset').onclick=()=>{if(confirm('Apagar o progresso deste protótipo?')){state={...defaults,family:state.family};save();stats();message('Progresso reiniciado.')}};
$('#fullscreen').onclick=()=>{if(canvas.requestFullscreen)canvas.requestFullscreen().catch(()=>message('Tela cheia indisponível neste navegador.'))};
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);
fetch('sprites/manifest.json').then(r=>{if(!r.ok)throw Error('Manifesto HTTP '+r.status);return r.json()}).then(items=>{for(const item of items){const name=typeof item==='string'?item:item.file;const m=/^(pack(\d+))_\d+\.png$/i.exec(name||'');if(!m||![17,19,21,26].includes(Number(m[2])))continue;if(!packs.has(m[1]))packs.set(m[1],[]);packs.get(m[1]).push(name)}const names=[...packs.keys()].sort((a,b)=>Number(a.slice(4))-Number(b.slice(4)));for(const name of names){packs.get(name).sort();const opt=document.createElement('option');opt.value=name;opt.textContent='Criatura '+name.replace('pack','');$('#family').append(opt)}if(!packs.has(state.family))state.family=names[0]||'';$('#family').value=state.family;const elapsed=Math.min(86400,Math.max(0,(Date.now()-state.last)/1000));tick(elapsed);stats();save();message(names.length?'Escolha sua criatura e comece a cuidar dela.':'Nenhuma criatura disponível.');}).catch(e=>message('Erro ao carregar sprites: '+e.message));setInterval(save,15000);requestAnimationFrame(render);
</script></body></html>
