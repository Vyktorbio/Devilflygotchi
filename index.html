<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111018"><title>Devilflygotchi HTML5</title><style>html,body{margin:0;background:#111018;color:#eee;font:15px system-ui}main{max-width:560px;margin:auto;padding:15px}h1{font-size:22px}button,select{background:#292335;color:#fff;border:1px solid #645774;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}.screen{width:240px;height:320px;max-width:100%;background:#1b1424;border:6px solid #5e4d6d;border-radius:20px;margin:20px auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.pet{image-rendering:pixelated;max-width:190px;max-height:180px;object-fit:contain}.status{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.hint{font-size:12px;color:#b4acbf;line-height:1.5}.petname{font-weight:700;margin-bottom:15px}</style></head><body><main><h1>DEVILFLYGOTCHI <small>HTML5</small></h1><p class="hint">Protótipo web com sprites originais extraídos do jogo Java ME. As regras e ações ainda são provisórias.</p><label>Personagem <select id="character"></select></label><section class="screen"><div class="petname" id="petname"></div><img id="pet" class="pet" alt="Personagem"><p id="mood"></p></section><div class="status"><span id="hunger"></span><span id="fun"></span><span id="energy"></span></div><p class="controls"><button id="feed">Alimentar</button><button id="play">Brincar</button><button id="sleep">Dormir</button><button id="next">Outra animação</button></p><p class="hint">O progresso fica salvo neste navegador. Não representa ainda a lógica original do JAR.</p><p class="hint"><a style="color:#bca9ff" href="Devil_240x320.jar">JAR original</a></p></main><script>
const groups={};const select=document.querySelector('#character'),pet=document.querySelector('#pet');let state;const key='devilflygotchi-html5-v1';try{state=JSON.parse(localStorage.getItem(key))||{group:'',frame:0,hunger:70,fun:70,energy:70}}catch{state={group:'',frame:0,hunger:70,fun:70,energy:70}}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function render(){const frames=groups[state.group]||[];if(frames.length)pet.src='sprites/'+frames[((state.frame%frames.length)+frames.length)%frames.length];document.querySelector('#petname').textContent=state.group||'Devilflygotchi';document.querySelector('#hunger').textContent='Fome: '+state.hunger;document.querySelector('#fun').textContent='Diversão: '+state.fun;document.querySelector('#energy').textContent='Energia: '+state.energy;document.querySelector('#mood').textContent=state.energy<25?'Sonolento':state.hunger<25?'Com fome':state.fun<25?'Entediado':'Explorando';select.value=state.group;save()}
function act(kind){if(kind==='feed')state.hunger=Math.min(100,state.hunger+20);if(kind==='play'){state.fun=Math.min(100,state.fun+20);state.energy=Math.max(0,state.energy-8)}if(kind==='sleep')state.energy=Math.min(100,state.energy+25);state.frame++;render()}
document.querySelector('#feed').onclick=()=>act('feed');document.querySelector('#play').onclick=()=>act('play');document.querySelector('#sleep').onclick=()=>act('sleep');document.querySelector('#next').onclick=()=>{state.frame++;render()};select.onchange=()=>{state.group=select.value;state.frame=0;render()};
fetch('sprites/manifest.json').then(r=>{if(!r.ok)throw Error('Sprites indisponíveis');return r.json()}).then(items=>{for(const x of items){const file=x.file||x;const match=/^(pack\d+)_\d+\.png$/i.exec(file);if(!match)continue;(groups[match[1]]??=[]).push(file)}for(const k of Object.keys(groups).sort((a,b)=>Number(a.slice(4))-Number(b.slice(4)))){const o=document.createElement('option');o.value=k;o.textContent=k;select.append(o)}if(!groups[state.group])state.group=Object.keys(groups)[0]||'';render()}).catch(e=>{document.querySelector('#mood').textContent='Erro ao carregar sprites: '+e.message});
</script></body></html>
